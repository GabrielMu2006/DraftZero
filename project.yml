name: DraftZero
options:
  bundleIdPrefix: com.draftzero
  # V0.1.0 明确只支持 Apple Silicon + macOS 26（发布计划 A.2）；
  # 不再声明对更旧系统或 Intel 的支持。
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  DraftZeroCore:
    path: Core

targets:
  DraftZero:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: DraftZeroCore
        product: DraftZeroCore
      - target: DraftZeroWidget
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Draft Zero
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: com.draftzero.app
            CFBundleURLSchemes:
              - draftzero
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.draftzero.app
        PRODUCT_NAME: DraftZero
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: App/DraftZero.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
    # V0.1.0 修正（桌面组件不入系统画廊的根因）：WidgetKit 要求组件扩展必须
    # 沙盒化，系统才会收录并拉起。扩展已接沙盒 + App Group entitlement；
    # 主应用保持不沙盒（未签名分发取舍），仅接 App Group 与其共享数据容器。
    # 默认数据位置为 App Group 容器，Core/AppDatabase 会从旧位置成套迁移。

  DraftZeroWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
    dependencies:
      - package: DraftZeroCore
        product: DraftZeroCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Draft Zero Widget
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.draftzero.app.widget
        PRODUCT_NAME: DraftZeroWidget
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: Widget/DraftZeroWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
        SKIP_INSTALL: true

schemes:
  DraftZero:
    build:
      targets:
        DraftZero: all
    run:
      config: Debug
