name: DraftZero
options:
  bundleIdPrefix: com.draftzero
  # V0.1.0 明确只支持 Apple Silicon + macOS 26（发布计划 A.2）；
  # 不再声明对更旧系统或 Intel 的支持。
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  DraftZeroCore:
    path: Core

targets:
  DraftZero:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: DraftZeroCore
        product: DraftZeroCore
      - target: DraftZeroWidget
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Draft Zero
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 2
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: com.draftzero.app
            CFBundleURLSchemes:
              - draftzero
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.draftzero.app
        PRODUCT_NAME: DraftZero
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
    # V0.1.0 修正（桌面组件不入系统画廊的根因）：WidgetKit 要求组件扩展必须
    # 沙盒化，系统才会收录并拉起。扩展接沙盒 + temporary-exception 文件授权，
    # 读写主应用共享的 ~/Library/Application Support/DraftZero；
    # App Group entitlement 在 ad hoc 签名下会被 Xcode 拒绝（要求开发证书），
    # 故暂不使用；接入开发者证书后可切换为 App Group 方案。
    # 主应用保持不沙盒、无 entitlements（未签名分发取舍）。

  DraftZeroWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
    dependencies:
      - package: DraftZeroCore
        product: DraftZeroCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Draft Zero Widget
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 2
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.draftzero.app.widget
        PRODUCT_NAME: DraftZeroWidget
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: Widget/DraftZeroWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
        SKIP_INSTALL: true

schemes:
  DraftZero:
    build:
      targets:
        DraftZero: all
    run:
      config: Debug
